<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MentePlena — Loja</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            marca: {
              50:  '#FFF7ED',
              100: '#FFEDD5',
              200: '#FED7AA',
              300: '#FDBA74',
              400: '#FB923C',
              500: '#F97316',
              600: '#EA580C',
              700: '#C2410C',
              800: '#7C2D12',
              900: '#431407',
            },
            destaque: '#FFFF00',
          },
          fontFamily: {
            display: ['"Playfair Display"', 'Georgia', 'serif'],
            body:    ['"Source Sans 3"', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            card:   '0 2px 12px rgba(124,45,18,.08)',
            cardHover: '0 6px 24px rgba(124,45,18,.14)',
            nav:    '0 -2px 16px rgba(124,45,18,.06)',
            toast:  '0 4px 20px rgba(0,0,0,.18)',
          },
          borderRadius: {
            card:  '14px',
            btn:   '10px',
            input: '10px',
          },
        },
      },
    };
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { font-family: 'Source Sans 3', system-ui, sans-serif; }
    body { margin: 0; background: #e8e0d8; }

    /* ── Animação de entrada de tela ── */
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    [data-tela]:not(.hidden) {
      animation: fadeSlideIn .28s ease-out both;
    }

    /* ── Classe utilitária .badge ── */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: .7rem; font-weight: 700; letter-spacing: .03em;
      text-transform: uppercase; padding: 3px 9px; border-radius: 999px;
    }
    .badge-destaque { background: #FFFF00; color: #7C2D12; }
    .badge-sucesso  { background: #D1FAE5; color: #065F46; }
    .badge-info     { background: #FFEDD5; color: #7C2D12; }
    .badge-erro     { background: #FEE2E2; color: #991B1B; }

    /* ── Classe utilitária .card ── */
    .card {
      background: #fff; border-radius: 14px;
      box-shadow: 0 2px 12px rgba(124,45,18,.08);
      transition: box-shadow .2s, transform .15s;
    }
    .card-interactive:hover {
      box-shadow: 0 6px 24px rgba(124,45,18,.14);
      transform: translateY(-2px);
    }

    /* ── Classe utilitária .btn ── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      font-family: inherit; font-weight: 700; font-size: .95rem;
      padding: 13px 22px; border-radius: 10px; border: none;
      cursor: pointer; transition: all .18s; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(.97); }
    .btn-primario { background: #7C2D12; color: #fff; }
    .btn-primario:hover { background: #431407; }
    .btn-destaque  { background: #F97316; color: #fff; }
    .btn-destaque:hover { background: #C2410C; }
    .btn-outline {
      background: transparent; color: #7C2D12;
      border: 2px solid #7C2D12;
    }
    .btn-outline:hover { background: #FFF7ED; }
    .btn-gradiente {
      background: linear-gradient(135deg, #7C2D12, #F97316);
      color: #fff;
    }
    .btn-gradiente:hover { filter: brightness(1.08); }
    .btn-sm { padding: 8px 14px; font-size: .82rem; }
    .btn-icon {
      width: 38px; height: 38px; padding: 0;
      border-radius: 50%; display: inline-flex;
      align-items: center; justify-content: center;
    }

    /* ── Navegação ativa ── */
    [data-nav] { color: #A8A29E; transition: color .18s; }
    [data-nav].ativo { color: #F97316; }

    /* ── Scrollbar discreta ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #FDBA74; border-radius: 4px; }

    /* ── Foco visível ── */
    :focus-visible {
      outline: 2px solid #F97316;
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* ── Moldura de celular ── */
    .celular-frame {
      width: 390px; height: 100dvh; max-height: 844px;
      border-radius: 40px; overflow: hidden;
      border: 6px solid #1a1a1a;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      display: flex; flex-direction: column;
      position: relative; background: #FFF7ED;
    }
    @media (max-width: 430px) {
      .celular-frame {
        width: 100%; height: 100dvh; max-height: none;
        border-radius: 0; border: none;
        box-shadow: none;
      }
    }

    /* ── Toast ── */
    @keyframes toastIn  { from { opacity:0; transform:translateY(16px) scale(.94);} to {opacity:1; transform:translateY(0) scale(1);} }
    @keyframes toastOut { from {opacity:1; transform:translateY(0) scale(1);} to {opacity:0; transform:translateY(-10px) scale(.95);} }
    .toast-entrando { animation: toastIn .28s ease-out both; }
    .toast-saindo   { animation: toastOut .22s ease-in both; }
  </style>
</head>
<body class="bg-stone-300 font-body text-stone-800 antialiased">

  <!-- ══════════════ APP CONTAINER ══════════════ -->
  <div id="app" class="celular-frame mx-auto">

    <!-- Barra de status -->
    <div class="flex items-center justify-between px-7 pt-3 pb-1 bg-marca-800 text-white text-xs font-semibold select-none shrink-0" style="font-family:'Source Sans 3',sans-serif;">
      <span id="hora-status">09:41</span>
      <div class="flex items-center gap-1">
        <!-- sinal -->
        <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><rect x="0" y="7" width="2.5" height="4" rx=".5" fill="white" opacity=".35"/><rect x="3.5" y="5" width="2.5" height="6" rx=".5" fill="white" opacity=".55"/><rect x="7" y="2.5" width="2.5" height="8.5" rx=".5" fill="white" opacity=".75"/><rect x="10.5" y="0" width="2.5" height="11" rx=".5" fill="white"/></svg>
        <!-- wifi -->
        <svg width="15" height="11" viewBox="0 0 15 11" fill="none"><path d="M7.5 9.5a1.1 1.1 0 100-2.2 1.1 1.1 0 000 2.2zM4.3 7.3a3.2 3.2 0 016.4 0M1.6 4.8a6 6 0 0112 0M-1 2.2a8.7 8.7 0 0116 0" stroke="white" stroke-width="1.4" stroke-linecap="round"/></svg>
        <!-- bateria -->
        <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x=".5" y=".5" width="20" height="10" rx="2.5" stroke="white" stroke-opacity=".5"/><rect x="2" y="2" width="15" height="7" rx="1.5" fill="white"/><path d="M21.5 3.5v4a2 2 0 000-4z" fill="white" opacity=".5"/></svg>
      </div>
    </div>

    <!-- ═══ CONTEÚDO SCROLLÁVEL ═══ -->
    <main id="main" class="flex-1 overflow-y-auto bg-marca-50 relative">

      <!-- ══════════════ HEADER GLOBAL ══════════════ -->
      <header id="app-header" class="sticky top-0 z-30 bg-marca-800 text-white px-5 py-3.5 flex items-center justify-between shadow-md">
        <div class="flex items-center gap-2.5">
          <!-- Logo monograma -->
          <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
            <rect width="34" height="34" rx="8" fill="#F97316"/>
            <path d="M17 8v6.5M17 19v8M11 14.5h12" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="17" cy="17" r="14" stroke="white" stroke-width="1" opacity=".25" fill="none"/>
          </svg>
          <span class="font-display text-lg font-bold tracking-tight leading-none">MentePlena</span>
        </div>
        <div class="flex items-center gap-3">
          <button data-nav="notificacoes" onclick="mostrarTela('notificacoes')" class="relative p-1" aria-label="Notificações">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0112 0v5a2 2 0 01-2 2H8a2 2 0 01-2-2V8z"/><path d="M10 18a2 2 0 004 0"/></svg>
            <span class="absolute -top-0.5 -right-0.5 w-4 h-4 bg-destaque text-marca-800 text-[9px] font-bold rounded-full flex items-center justify-center">3</span>
          </button>
          <button data-nav="carrinho" onclick="mostrarTela('carrinho')" class="relative p-1" aria-label="Carrinho">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M1 1h3.5l2.5 13h10l3-8H5"/></svg>
            <span class="absolute -top-0.5 -right-0.5 w-4 h-4 bg-destaque text-marca-800 text-[9px] font-bold rounded-full flex items-center justify-center">2</span>
          </button>
        </div>
      </header>

      <!-- ═══ TELAS ═══ -->
      <!-- TELAS -->

      <!-- ══════════════ NAVEGAÇÃO INFERIOR ══════════════ -->
      <nav class="shrink-0 bg-white border-t border-marca-100 flex justify-around items-center pb-2 pt-1 px-1 shadow-nav z-40" style="padding-bottom: max(8px, env(safe-area-inset-bottom));">
        <button data-nav="vitrine-home" onclick="mostrarTela('vitrine-home')" class="flex flex-col items-center gap-0.5 py-1.5 px-2 min-w-[56px]">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a1 1 0 01-1 1H4a1 1 0 01-1-1z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span class="text-[10px] font-semibold">Início</span>
        </button>
        <button data-nav="catalogo" onclick="mostrarTela('catalogo')" class="flex flex-col items-center gap-0.5 py-1.5 px-2 min-w-[56px]">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          <span class="text-[10px] font-semibold">Catálogo</span>
        </button>
        <button data-nav="meus-pedidos" onclick="mostrarTela('meus-pedidos')" class="flex flex-col items-center gap-0.5 py-1.5 px-2 min-w-[56px]">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span class="text-[10px] font-semibold">Pedidos</span>
        </button>
        <button data-nav="meu-perfil" onclick="mostrarTela('meu-perfil')" class="flex flex-col items-center gap-0.5 py-1.5 px-2 min-w-[56px]">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span class="text-[10px] font-semibold">Perfil</span>
        </button>
      </nav>
    </main>
  </div>

  <!-- ══════════════ TOASTS ══════════════ -->
  <div id="toasts" class="fixed bottom-20 left-1/2 -translate-x-1/2 z-[100] flex flex-col items-center gap-2 pointer-events-none" style="max-width:360px;"></div>

  <!-- ══════════════ MODAL GENÉRICO ══════════════ -->
  <div id="modal-overlay" class="fixed inset-0 z-[90] bg-black/50 hidden items-end sm:items-center justify-center p-0 sm:p-4" onclick="if(event.target===this)fecharModal()">
    <div id="modal-card" class="bg-white rounded-t-2xl sm:rounded-2xl w-full sm:max-w-md max-h-[85vh] flex flex-col shadow-2xl">
      <div class="flex items-center justify-between px-5 pt-5 pb-3 border-b border-stone-100">
        <h3 id="modal-titulo" class="font-display text-lg font-bold text-marca-800">Título</h3>
        <button onclick="fecharModal()" class="btn-icon bg-stone-100 hover:bg-stone-200 text-stone-600" aria-label="Fechar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="modal-conteudo" class="px-5 py-4 overflow-y-auto text-sm leading-relaxed"></div>
    </div>
  </div>

  <!-- ══════════════ UTILITÁRIOS GLOBAIS ══════════════ -->
  <script>
    /* ── Relógio da barra de status ── */
    (function relogio(){
      var h = document.getElementById('hora-status');
      function t(){
        var d=new Date();
        h.textContent = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
      }
      t(); setInterval(t, 30000);
    })();

    /* ── Roteador ── */
    function mostrarTela(id) {
      document.querySelectorAll('[data-tela]').forEach(function(s){
        s.classList.toggle('hidden', s.dataset.tela !== id);
      });
      document.querySelectorAll('[data-nav]').forEach(function(b){
        b.classList.toggle('ativo', b.dataset.nav === id);
      });
      window.scrollTo({ top: 0 });
    }

    /* ── Toast ── */
    function toast(mensagem, tipo) {
      var c = document.getElementById('toasts');
      var el = document.createElement('div');
      var cores = { ok:'bg-green-600', erro:'bg-red-600', info:'bg-marca-800' };
      var icones = {
        ok:   '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>',
        erro: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
        info: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="11"/></svg>',
      };
      el.className = 'toast-entrando pointer-events-auto flex items-center gap-2.5 ' + (cores[tipo]||cores.info) + ' text-white text-sm font-semibold px-4 py-3 rounded-xl shadow-toast';
      el.innerHTML = (icones[tipo]||icones.info) + '<span>' + mensagem + '</span>';
      c.appendChild(el);
      setTimeout(function(){
        el.classList.remove('toast-entrando');
        el.classList.add('toast-saindo');
        setTimeout(function(){ el.remove(); }, 240);
      }, 3000);
    }

    /* ── Modal ── */
    function abrirModal(html, titulo) {
      var o = document.getElementById('modal-overlay');
      document.getElementById('modal-titulo').textContent = titulo || '';
      document.getElementById('modal-conteudo').innerHTML = html;
      o.classList.remove('hidden');
      o.classList.add('flex');
    }
    function fecharModal() {
      var o = document.getElementById('modal-overlay');
      o.classList.add('hidden');
      o.classList.remove('flex');
    }
    document.addEventListener('keydown', function(e){ if(e.key==='Escape') fecharModal(); });

    /* ── Formatação monetária ── */
    function brl(valor) {
      return 'R$ ' + valor.toFixed(2).replace('.', ',');
    }

    /* ── Data BR ── */
    function dataBR(iso) {
      var p = iso.split('-');
      return p[2] + '/' + p[1] + '/' + p[0];
    }

    /* ── Inicialização ── */
    document.addEventListener('DOMContentLoaded', function(){
      mostrarTela('vitrine-home');
    });
  </script>
</body>
</html>
