  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { display: ['"DM Serif Display"', 'Georgia', 'serif'], body: ['Outfit', 'system-ui', 'sans-serif'] },
          colors: {
            marca: { 50:'#fef7f0',100:'#fdebd5',200:'#fad5ab',300:'#f6b87a',400:'#f29548',500:'#f97316',600:'#7C2D12',700:'#68220f',800:'#541a0c',900:'#3d1309' },
            accent: { 50:'#fffce8',100:'#fff8c5',200:'#ffef87',300:'#ffe64d',400:'#ffff00',500:'#e6d700',600:'#b8ae00',700:'#8a8300',800:'#5c5700',900:'#2e2b00' },
            cream: { 50:'#FFF7ED',100:'#FFF3E4',200:'#FFEAD9',300:'#FFDFC4' },

          borderRadius: { card:'14px', btn:'10px', pill:'9999px', input:'10px' },
        }
      }

  <style>
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: 'Outfit', system-ui, sans-serif; background: linear-gradient(145deg,#1a0e08 0%,#2d1810 40%,#1a0e08 100%); display: flex; align-items: center; justify-content: center; }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #e5e0d8; border-radius: 10px; }

    :focus-visible { outline: 2.5px solid #f97316; outline-offset: 2px; border-radius: 6px; }

    [data-tela]:not(.hidden) { animation: fadeSlide .32s cubic-bezier(.22,1,.36,1) both; }
    @keyframes fadeSlide { from { opacity:0; transform:translateY(11px); } to { opacity:1; transform:translateY(0); } }

    .ativo { color: #f97316 !important; }
    .ativo svg { stroke: #f97316; }
    .ativo .nav-dot { opacity: 1; transform: scale(1); }

    .card { background:#fff; border-radius:14px; box-shadow:0 1px 3px rgba(124,45,18,.07),0 1px 2px rgba(124,45,18,.05); transition:box-shadow .25s,transform .25s; }
    .card:active { transform:scale(.985); }
    .card-interactive:hover { box-shadow:0 8px 25px rgba(124,45,18,.12); transform:translateY(-2px); }

    .badge { display:inline-flex; align-items:center; gap:4px; padding:4px 11px; border-radius:9999px; font-size:11px; font-weight:600; letter-spacing:.02em; line-height:1.4; }

    .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:14px 20px; border:none; border-radius:10px; font-family:'Outfit',system-ui,sans-serif; font-size:15px; font-weight:600; cursor:pointer; transition:background .2s,transform .15s,box-shadow .2s; position:relative; overflow:hidden; }
    .btn:active { transform:scale(.97); }
    .btn-primary { background:#7C2D12; color:#fff; box-shadow:0 2px 8px rgba(124,45,18,.25); }
    .btn-primary:hover { background:#541a0c; box-shadow:0 4px 14px rgba(124,45,18,.3); }
    .btn-accent { background:#f97316; color:#fff; box-shadow:0 2px 8px rgba(249,115,22,.25); }
    .btn-accent:hover { background:#ea6c0a; }
    .btn-ghost { background:transparent; color:#7C2D12; border:1.5px solid #e5e0d8; }
    .btn-ghost:hover { background:#fef7f0; }
    .btn-sm { padding:9px 15px; font-size:13px; }

    .app-frame { width:390px; height:844px; max-height:95vh; border-radius:44px; overflow:hidden; background:#FFF7ED; position:relative; box-shadow:0 25px 80px rgba(0,0,0,.25); border:8px solid #2a2a2a; display:flex; flex-direction:column; }
    @media(max-width:430px) { .app-frame { width:100%; height:100%; max-height:100vh; border-radius:0; border:none; box-shadow:none; } }

    #toast-container { position:fixed; top:70px; left:50%; transform:translateX(-50%); z-index:9999; display:flex; flex-direction:column; gap:8px; pointer-events:none; width:calc(100% - 32px); max-width:350px; }
    .toast { padding:12px 18px; border-radius:12px; color:#fff; font-size:13px; font-weight:500; font-family:'Outfit',system-ui,sans-serif; display:flex; align-items:center; gap:10px; animation:toastIn .35s cubic-bezier(.22,1,.36,1); backdrop-filter:blur(8px); box-shadow:0 6px 20px rgba(0,0,0,.15); pointer-events:auto; }
    .toast.removing { animation:toastOut .3s ease-in forwards; }
    .toast-ok { background:rgba(22,120,60,.92); }
    .toast-erro { background:rgba(180,35,35,.92); }
    .toast-info { background:rgba(60,50,130,.92); }
    @keyframes toastIn { from { opacity:0; transform:translateY(-16px) scale(.94); } to { opacity:1; transform:translateY(0) scale(1); } }
    @keyframes toastOut { from { opacity:1; transform:translateY(0) scale(1); } to { opacity:0; transform:translateY(-12px) scale(.94); } }

    #modal-overlay { position:fixed; inset:0; background:rgba(10,5,2,.55); backdrop-filter:blur(3px); z-index:8000; display:none; align-items:flex-end; justify-content:center; animation:fadeIn .2s ease; }
    #modal-overlay.open { display:flex; }
    @media(min-width:431px) { #modal-overlay { align-items:center; } }
    #modal-card { background:#fff; border-radius:20px 20px 0 0; width:100%; max-height:78vh; display:flex; flex-direction:column; animation:slideUp .32s cubic-bezier(.22,1,.36,1); }
    @media(min-width:431px) { #modal-card { border-radius:20px; width:390px; max-height:70vh; } }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    @keyframes slideUp { from { transform:translateY(100%); } to { transform:translateY(0); } }

    .input-field { width:100%; padding:13px 16px; border:1.5px solid #e5e0d8; border-radius:10px; font-family:'Outfit',system-ui,sans-serif; font-size:14px; color:#3d1309; background:#fff; outline:none; transition:border-color .2s,box-shadow .2s; }
    .input-field:focus { border-color:#f97316; box-shadow:0 0 0 3px rgba(249,115,22,.12); }
    .input-field::placeholder { color:#b8a898; }

    .label { display:block; font-size:12px; font-weight:600; color:#7C2D12; margin-bottom:5px; letter-spacing:.03em; text-transform:uppercase; }

    .section-title { font-family:'DM Serif Display',Georgia,serif; font-size:22px; color:#3d1309; margin:0 0 6px; line-height:1.25; }
    .section-subtitle { font-size:13px; color:#a08060; font-weight:400; line-height:1.5; }

    .skeleton { background:linear-gradient(90deg,#f0e6db 25%,#f5ede3 50%,#f0e6db 75%); background-size:200% 100%; animation:skeletonShine 1.6s infinite; border-radius:8px; }
    @keyframes skeletonShine { 0% { background-position:200% 0; } 100% { background-position:-200% 0; } }
  </style>
</head>

  <script>
    // ── Toast ──
    var toastTimers = {};
    function toast(msg, tipo) {
      tipo = tipo || 'info';
      var icons = { ok:'✓', erro:'✕', info:'ℹ' };
      var el = document.createElement('div');
      el.className = 'toast toast-' + tipo;
      el.innerHTML = '<span style="font-weight:700;font-size:15px;">' + (icons[tipo]||'ℹ') + '</span><span>' + msg + '</span>';
      document.getElementById('toast-container').appendChild(el);
      toastTimers[el.id = 'tw_' + Date.now()] = setTimeout(function () {
        el.classList.add('removing');
        setTimeout(function () { el.remove(); delete toastTimers[el.id]; }, 300);
      }, 3000);
    }

    // ── Modal ──
    function abrirModal(html, titulo) {
      document.getElementById('modal-title').textContent = titulo || '';
      document.getElementById('modal-body').innerHTML = html;
      var o = document.getElementById('modal-overlay');
      o.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function fecharModal() {
      document.getElementById('modal-overlay').classList.remove('open');
      document.body.style.overflow = '';
    }
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') fecharModal(); });

    // ── Formatadores ──
    function brl(v) { return 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits:2, maximumFractionDigits:2 }); }
    function dataBR(iso) {
      if (!iso) return '—';
      var d = new Date(iso + 'T00:00:00');
      return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear();
    }

    // ── Roteador ──
    function mostrarTela(id) {
      document.querySelectorAll('[data-tela]').forEach(function (s) { s.classList.toggle('hidden', s.dataset.tela !== id); });
      document.querySelectorAll('[data-nav]').forEach(function (b) { b.classList.toggle('ativo', b.dataset.nav === id); });
      window.scrollTo({ top: 0 });
    }

    document.addEventListener('DOMContentLoaded', function () { mostrarTela('vitrine-inicial'); });
    document.addEventListener('keyup', function (e) { if (e.key === 'Escape') fecharModal(); });
  </script>
</body>
</html>
